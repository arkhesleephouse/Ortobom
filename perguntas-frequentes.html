<script>
  const FAQS = [
    {
      q: "Qual o horário de funcionamento da Ortobom T-7?",
      a: "Atendemos de segunda a sexta das 8h às 19h30, e aos sábados das 8h às 14h. A loja fica na Av. T-7, 554, Setor Bueno, Goiânia."
    },
    {
      q: "Onde fica a loja Ortobom T-7 em Goiânia?",
      a: "Estamos na Av. T-7, 554, Setor Bueno, Goiânia - GO. É só chegar, testar os colchões pessoalmente e conversar com um consultor."
    },
    {
      q: "Qual a melhor loja de colchão em Goiânia?",
      a: "A Ortobom T-7 é uma loja oficial Ortobom no Setor Bueno, com atendimento consultivo, mais de 25 modelos de colchão em exposição para testar antes de comprar, parcelamento em até 21x e nota 5.0 no Google. Fabricante com mais de 60 anos de mercado e uma das maiores fábricas de colchões do Brasil."
    },
    {
      q: "Posso parcelar a compra do colchão?",
      a: "Sim, parcelamos em até 21x sem juros no cartão de crédito, dependendo do modelo e condições vigentes. Fale com um consultor pelo WhatsApp para simular o parcelamento do produto que você quer."
    },
    {
      q: "Qual a garantia dos colchões Ortobom?",
      a: "Os colchões Ortobom têm garantia estrutural que varia por modelo, com linhas que chegam a 5 anos. Consulte o consultor sobre o prazo específico do modelo que te interessa."
    },
    {
      q: "Qual colchão Ortobom é melhor para quem sente dor nas costas?",
      a: "Para quem sente dor nas costas, a recomendação costuma ser um colchão mais firme, como os da linha Ortopédico Premium ou Pró Saúde Ortopédico, que têm estrutura reforçada. O ideal é testar pessoalmente na loja ou responder o teste de perfil de sono no site para receber uma indicação personalizada."
    },
    {
      q: "A loja vende só colchão ou também base, cabeceira e outros produtos?",
      a: "Vendemos linha completa: colchões, bases, cabeceiras, roupas de cama, travesseiros, acessórios (como pillow tops) e móveis, como sofás-cama e poltronas reclináveis."
    },
    {
      q: "Como faço para saber qual colchão combina comigo?",
      a: "Você pode responder o teste rápido de perfil de sono na página inicial do site, que já te direciona pro WhatsApp com uma indicação personalizada, ou vir até a loja e testar os modelos pessoalmente com a ajuda de um consultor — sem compromisso."
    },
    {
      q: "A Ortobom T-7 faz entrega em toda Goiânia?",
      a: "Sim, entregamos em Goiânia e região metropolitana. Fale com um consultor pelo WhatsApp para confirmar prazo e condições de entrega para o seu endereço."
    },
    {
      q: "A Ortobom T-7 é uma loja oficial da marca?",
      a: "Sim, somos uma franquia oficial Ortobom, com produtos genuínos direto de fábrica e a mesma garantia da marca nacional."
    }
  ];

  const faqList = document.getElementById('faq-list');
  faqList.innerHTML = FAQS.map(f => `
    <div class="faq-item">
      <h3>${f.q}</h3>
      <p>${f.a}</p>
    </div>
  `).join('');

  // SEO/GEO: dados estruturados FAQPage — ajuda o site a aparecer em respostas de IA e no Google
  const faqSchema = {
    "@context": "https://schema.org",
    "@type": "FAQPage",
    "mainEntity": FAQS.map(f => ({
      "@type": "Question",
      "name": f.q,
      "acceptedAnswer": { "@type": "Answer", "text": f.a }
    }))
  };
  const script = document.createElement('script');
  script.type = 'application/ld+json';
  script.textContent = JSON.stringify(faqSchema);
  document.head.appendChild(script);
</script>
