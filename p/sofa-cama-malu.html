<script>window.__PID="sofa-cama-malu";</script>
<script src="products-data.js?v=1791328276"></script>
<script src="product-specs.js?v=1791328276"></script>
<script src="site.js?v=1791328276"></script>
<script>
  function sizeName(m){return ({"88 x 188":"Solteiro","108 x 198":"Solteiro Extra","138 x 188":"Casal","158 x 198":"Queen","193 x 203":"King","120 x 8 x 90":"Solteiro","120 x 8 x 110":"Solteiro Extra","120 x 8 x 140":"Casal","120 x 8 x 160":"Queen","120 x 8 x 195":"King"})[m]||"Medida";}
  const id = window.__PID || new URLSearchParams(window.location.search).get('id');
  const product = PRODUCTS.find(p => p.id === id);
  const root = document.getElementById('product-root');
  const catLabel = {colchoes:'Colchões', acessorios:'Acessórios', bases:'Bases', cabeceiras:'Cabeceiras', 'roupas-de-cama':'Roupas de Cama', travesseiros:'Travesseiros', moveis:'Móveis'};

  if (!product){
    root.innerHTML = `<div class="coming-soon"><div class="glyph"><svg viewBox="0 0 24 24" width="52" height="52" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg></div><h2>Produto não encontrado</h2><p>Esse produto pode ter mudado de nome ou saído do catálogo.</p><a href="colchoes.html" class="btn-primary" style="background:linear-gradient(135deg,var(--blue),var(--navy));color:#fff;">Ver catálogo de colchões</a></div>`;
  } else {
    const fullUrl = `https://www.ortobomt7.com.br/p/${product.id}.html`;
    const fullImg = `https://www.ortobomt7.com.br/${coverImage(product)}`;
    if (!window.__PID) {
    document.getElementById('page-title').textContent = `${product.name} | Ortobom T-7`;
    document.getElementById('page-desc').setAttribute('content', product.desc);
    document.getElementById('og-title').setAttribute('content', `${product.name} | Ortobom T-7`);
    document.getElementById('og-desc').setAttribute('content', product.desc);
    document.getElementById('og-image').setAttribute('content', fullImg);
    document.getElementById('og-url').setAttribute('content', fullUrl);
    document.getElementById('canonical-link').setAttribute('href', fullUrl);
    }
    const catPage = product.category + '.html';
    document.getElementById('breadcrumb').innerHTML = `<a href="index.html">Início</a> / <a href="${catPage}">${catLabel[product.category]||''}</a> / ${product.name}`;

    root.classList.toggle('cat-contain', product.category !== 'colchoes');
    root.innerHTML = `
      <div class="product-detail">
        <div>
          <div class="product-gallery-main">
            <img id="gallery-main-img" src="${coverImage(product)}" alt="${product.name}">
            ${product.images.length > 1 ? `<button class="g-arrow g-prev" aria-label="Foto anterior">‹</button><button class="g-arrow g-next" aria-label="Próxima foto">›</button><span class="g-count" id="g-count">1 / ${product.images.length}</span>` : ''}
          </div>
          ${product.images.length > 1 ? `
          <div class="product-gallery-thumbs">
            ${product.images.map((img, i) => `
              <button data-i="${i}" class="${i===0?'active':''}" title="${img.label||''}">
                <img src="${img.url}" alt="${product.name} - ${img.label||''}" loading="lazy" decoding="async">
              </button>
            `).join('')}
          </div>` : ''}
        </div>
        <div class="product-detail-info">
          <span class="section-kicker">${product.line || catLabel[product.category] || ''}</span>
          <h1>${product.name}</h1>
          <p class="desc">${product.desc}</p>
          <div class="price-block"><strong class="price-consult" style="font-size:22px;">Consulte condições especiais</strong><span>Parcele em até 21x no cartão</span></div>
          ${(typeof SPECS!=='undefined' && SPECS[product.id] && SPECS[product.id].medidas && SPECS[product.id].medidas.length>1) ? `
          <div class="pd-sizes">
            <span class="pd-sizes-label">Tamanho: <strong id="pd-size-name"></strong></span>
            <div class="pd-sizes-opts">
              ${SPECS[product.id].medidas.map(m=>`<button type="button" data-m="${m}"><b>${sizeName(m)}</b><i>${m} cm</i></button>`).join('')}
            </div>
            <p class="pd-sizes-note">Consulte condições especiais para o tamanho escolhido com nosso consultor.</p>
          </div>` : ''}
          <a href="${waLink(product.name)}" target="_blank" rel="noopener" class="pd-cta" id="pd-cta">Quero este produto no WhatsApp</a>
          <a href="https://www.google.com/maps/search/?api=1&query=Ortobom+T-7+Av.+T-7+554+Goi%C3%A2nia" target="_blank" rel="noopener" class="pd-cta-sec">Experimentar na loja · Av. T-7, 554, Setor Bueno</a>
          <p class="pd-note">Condições sujeitas a confirmação com a loja.</p>
        </div>
      </div>
      ${(typeof SPECS!=='undefined' && SPECS[product.id]) ? (()=>{const s=SPECS[product.id];return `
      <div class="pd-specs">
        <h2>Ficha técnica</h2>
        <div class="pd-specs-grid">
          ${s.rows ? s.rows.map(r=>`<div><span>${r[0]}</span><strong>${r[1]}</strong></div>`).join('') : `
          <div><span>${s.alturaLabel||'Altura'}</span><strong>${s.altura}</strong></div>
          <div><span>${s.medidasLabel||'Medidas disponíveis (cm)'}</span><strong>${s.medidas.map(m=>m.replace(/^120 x 8 x /,'')).join(' · ')}</strong></div>
          <div><span>Garantia</span><strong>${s.garantia.join(' · ')}</strong></div>`}
        </div>
        <ul class="pd-feats">${s.destaques.map(d=>`<li>${d}</li>`).join('')}</ul>
        <p class="pd-note">Informações do ${s.fonte||'catálogo oficial Ortobom'}. Fotos meramente ilustrativas; confirme medidas e disponibilidade com a loja.</p>
      </div>`})() : ''}
      <div id="pd-combine"></div>
    `;


    // Seletor de tamanho -> mensagem de WhatsApp com o tamanho escolhido
    (function(){
      const btns=[...document.querySelectorAll('.pd-sizes-opts button')]; if(!btns.length) return;
      const cta=document.getElementById('pd-cta'), nm=document.getElementById('pd-size-name');
      function pick(b){
        btns.forEach(x=>x.classList.toggle('active',x===b));
        const m=b.dataset.m, n=sizeName(m); nm.textContent=n==='Medida' ? m+' cm' : n;
        const art=product.category==='colchoes'?'o colchão':(product.category==='cabeceiras'?'a':'o produto');const msg=`Oi! Vi ${art} ${product.name} no tamanho ${n==='Medida'?'':n+' '}(${m} cm) no site da Ortobom T-7 e quero mais informações.`;
        cta.href=`https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(withOrigem(msg))}`;
        cta.textContent='Falar com um consultor sobre este tamanho';
      }
      btns.forEach(b=>b.addEventListener('click',()=>pick(b)));
      pick(btns.find(b=>b.dataset.m==='138 x 188'||b.dataset.m==='120 x 8 x 140')||btns[0]);
    })();

    // Galeria: miniaturas, setas, teclado e deslize
    (function(){
      const imgs = product.images; let cur = 0;
      const main = document.getElementById('gallery-main-img');
      const cnt = document.getElementById('g-count');
      const nameEl = document.getElementById('color-selected-name');
      function go(i){
        cur = (i + imgs.length) % imgs.length;
        main.src = imgs[cur].url;
        if (cnt) cnt.textContent = (cur+1) + ' / ' + imgs.length;
        document.querySelectorAll('.product-gallery-thumbs button').forEach((b,k)=>b.classList.toggle('active',k===cur));
        const act = document.querySelector('.product-gallery-thumbs button.active'); if (act && act.scrollIntoView) act.scrollIntoView({block:'nearest',inline:'nearest'});
      }
      document.querySelectorAll('.product-gallery-thumbs button').forEach(b => b.addEventListener('click',()=>go(+b.dataset.i)));
      const pv=document.querySelector('.g-prev'), nx=document.querySelector('.g-next');
      if (pv) pv.addEventListener('click',()=>go(cur-1));
      if (nx) nx.addEventListener('click',()=>go(cur+1));
      document.addEventListener('keydown',e=>{ if(e.key==='ArrowLeft') go(cur-1); if(e.key==='ArrowRight') go(cur+1); });
      let x0=null; main.addEventListener('touchstart',e=>{x0=e.touches[0].clientX},{passive:true});
      main.addEventListener('touchend',e=>{ if(x0===null) return; const dx=e.changedTouches[0].clientX-x0; if(Math.abs(dx)>40) go(cur+(dx<0?1:-1)); x0=null; });
    })();

    // Combina com: bases e travesseiros do catálogo (só para colchões)
    if (product.category === 'colchoes'){
      const combo = [...PRODUCTS.filter(p=>p.category==='bases').slice(0,2), ...PRODUCTS.filter(p=>p.category==='travesseiros').slice(0,2)];
      if (combo.length){
        document.getElementById('pd-combine').innerHTML = '<div class="pd-combine"><h2>Complete seu quarto</h2><div class="grid" id="grid-combine"></div></div>';
        renderProductGrid('grid-combine', combo, '');
      }
    }

    // Relacionados: mesma linha, excluindo o próprio produto
    const related = PRODUCTS.filter(p => (product.line ? p.line === product.line : (!p.line && p.category === product.category)) && p.id !== product.id).slice(0,4);
    if (!product.line) document.querySelector('#related-section h2').textContent = 'Outros modelos de ' + (catLabel[product.category] || 'Ortobom').toLowerCase();
    if (related.length){
      document.getElementById('related-section').style.display = '';
      renderProductGrid('grid-related', related, product.line);
    }

    // SEO: dados estruturados do produto (schema.org Product)
    const productUrl = `https://www.ortobomt7.com.br/p/${product.id}.html`;
    const productSchema = {
      "@context": "https://schema.org",
      "@type": "Product",
      "name": product.name,
      "image": `https://www.ortobomt7.com.br/${coverImage(product)}`,
      "description": product.desc,
      "brand": { "@type": "Brand", "name": "Ortobom" },
      "url": productUrl,
    };
    const breadcrumbSchema = {
      "@context": "https://schema.org",
      "@type": "BreadcrumbList",
      "itemListElement": [
        { "@type": "ListItem", "position": 1, "name": "Início", "item": "https://www.ortobomt7.com.br/" },
        { "@type": "ListItem", "position": 2, "name": catLabel[product.category] || '', "item": `https://www.ortobomt7.com.br/${product.category}.html` },
        { "@type": "ListItem", "position": 3, "name": product.name, "item": productUrl }
      ]
    };
    if (!document.getElementById('schema-product')) [productSchema, breadcrumbSchema].forEach((schema, i) => {
      const script = document.createElement('script');
      script.type = 'application/ld+json';
      script.textContent = JSON.stringify(schema);
      document.head.appendChild(script);
    });

  }
</script>
